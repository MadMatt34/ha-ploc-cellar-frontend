name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Type-check, test and build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Type-check
        run: npm run check
      - name: Run frontend unit tests with coverage
        run: npm test
      - name: Build standalone dashboard module
        run: npm run build
      - name: Prepare HACS distributable
        run: cp dist/ploc-cellar-card.js ploc-cellar-card.js
      - name: Verify distributables exist
        run: test -s dist/ploc-cellar-card.js && test -s ploc-cellar-card.js
      - name: Verify generated HACS bundle matches the build output
        run: cmp --silent dist/ploc-cellar-card.js ploc-cellar-card.js
      - name: Report committed bundle updates
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- dist/ploc-cellar-card.js ploc-cellar-card.js; then
            echo "::warning::The generated bundles differ from the committed files. The protected main-branch publish job regenerates and commits them after merge."
          fi

  browser:
    name: Browser interaction tests (Chromium)
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser interaction tests
        run: npm run test:e2e

  publish:
    name: Update committed distributables
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, browser]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build distributables
        run: npm run build && cp dist/ploc-cellar-card.js ploc-cellar-card.js
      - name: Commit distributables when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ploc-cellar-card.js ploc-cellar-card.js
          if ! git diff --cached --quiet; then
            git commit -m "Build Ploc Cellar Cards [skip ci]"
            git push
          fi
