name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Type-check, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Run frontend unit tests with coverage
        run: npm test
      - name: Build standalone dashboard module
        run: npm run build
      - name: Prepare HACS distributable
        run: cp dist/ploc-cellar-card.js ploc-cellar-card.js
      - name: Verify distributables exist
        run: test -s dist/ploc-cellar-card.js && test -s ploc-cellar-card.js
      - name: Verify committed distributables are up to date
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- dist/ploc-cellar-card.js ploc-cellar-card.js

  publish:
    name: Update committed distributables
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build distributables
        run: npm run build && cp dist/ploc-cellar-card.js ploc-cellar-card.js
      - name: Commit distributables when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ploc-cellar-card.js ploc-cellar-card.js
          if ! git diff --cached --quiet; then
            git commit -m "Build Ploc Cellar Cards [skip ci]"
            git push
          fi
