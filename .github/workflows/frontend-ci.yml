name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Build standalone dashboard module
        run: npm run build
      - name: Prepare HACS distributable
        run: cp dist/ploc-cellar-card.js ploc-cellar-card.js
      - name: Verify distributables
        run: test -s dist/ploc-cellar-card.js && test -s ploc-cellar-card.js
      - name: Commit distributable
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ploc-cellar-card.js ploc-cellar-card.js
          if ! git diff --cached --quiet; then
            git commit -m "Build Ploc Cellar Cards [skip ci]"
            git push
          fi
