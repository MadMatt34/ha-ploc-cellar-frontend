name: Auto-merge generated bundles

on:
  workflow_run:
    workflows:
      - Frontend CI
      - HACS validation
    types:
      - completed

concurrency:
  group: auto-merge-generated-bundles-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  merge:
    name: Merge generated-bundles PR when checks pass
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'automation/update-hacs-bundles' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    env:
      GH_REPO: ${{ github.repository }}
    permissions:
      contents: read
    steps:
      - name: Create narrowly scoped publication-app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BUNDLE_PUBLISH_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUNDLE_PUBLISH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read

      - name: Find and validate generated-bundles pull request
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          PR_NUMBER="$(gh pr list --head "$HEAD_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            echo "No open generated-bundles pull request was found."
            exit 0
          fi

          PR_DATA="$(gh pr view "$PR_NUMBER" --json baseRefName,headRefName,isDraft,files)"
          echo "$PR_DATA" | jq -e '
            .baseRefName == "main" and
            .headRefName == "automation/update-hacs-bundles" and
            .isDraft == false and
            ([.files[].path] | sort) == ["dist/ploc-cellar-card.js", "ploc-cellar-card.js"]
          ' >/dev/null || {
            echo "::error::The pull request does not match the exact generated-bundle scope."
            exit 1
          }

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Wait for every pull-request check
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr checks "${{ steps.pr.outputs.number }}" --watch

      - name: Merge with the dedicated app identity
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge "${{ steps.pr.outputs.number }}" --squash --delete-branch
